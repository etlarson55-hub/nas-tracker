name: Fetch HDD Prices

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Node 24 has native fetch — no npm install needed.

      - name: Run fetch script
        run: node fetch-prices.js
        env:
          SERP_API_KEY:   ${{ secrets.SERP_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          # Optional: override the site URL if your Pages URL differs
          # SITE_URL: https://yourusername.github.io/nas-tracker/

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update prices $(date -u +%Y-%m-%d)"
          git push
