name: Fetch Drive Prices

on:
  schedule:
    - cron: '0 14 * * *'   # Every day at 2pm UTC (10am Eastern)
  workflow_dispatch:         # Manual trigger button in GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # Required to commit prices.json back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch prices from SerpAPI
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: node fetch-prices.js

      - name: Commit updated prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
