name: Fetch Drive Prices

on:
  schedule:
    - cron: '0 14 * * *'   # 2:00 PM UTC daily (8 AM MDT / 10 AM EDT)
  workflow_dispatch:         # allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch prices from SerpAPI and send email
        env:
          SERP_API_KEY:     ${{ secrets.SERP_API_KEY }}
          EJS_PUBLIC_KEY:   ${{ secrets.EJS_PUBLIC_KEY }}
          EJS_SERVICE_ID:   ${{ secrets.EJS_SERVICE_ID }}
          EJS_TEMPLATE_ID:  ${{ secrets.EJS_TEMPLATE_ID }}
          ALERT_EMAIL:      ${{ secrets.ALERT_EMAIL }}
        run: node fetch-prices.js

      - name: Commit updated prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "chore: update drive prices $(date -u +%Y-%m-%d)"
          git push
