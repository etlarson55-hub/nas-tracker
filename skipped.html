<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skipped Items — NAS Drive Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #030712;
      --surface: #0f172a;
      --border:  #1e293b;
      --text:    #f1f5f9;
      --muted:   #64748b;
      --accent:  #3b82f6;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      min-height: 100vh;
      padding-bottom: 48px;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    a { color: var(--accent); }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 0 14px;
      margin-bottom: 24px;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-title h1 { font-size: 1.15rem; font-weight: 800; }
    .header-meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .back-btn {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      background: var(--border);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .back-btn:hover { color: var(--text); }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-btn {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: #1d4ed810; }

    /* Section heading */
    .section-heading {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Reason group */
    .reason-group { margin-bottom: 28px; }
    .reason-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .reason-label h2 { font-size: 0.9rem; font-weight: 700; }
    .reason-count {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--border);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Skip item */
    .skip-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 8px;
    }
    .skip-title {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .skip-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .skip-retailer {
      background: #1d4ed820;
      color: var(--accent);
      border: 1px solid #1d4ed840;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }
    .skip-price { font-weight: 700; color: var(--text); }

    /* Detail toggle */
    .detail-toggle {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      user-select: none;
      background: none;
      border: none;
      padding: 0;
    }
    .detail-toggle:hover { color: var(--text); }
    .detail-panel {
      display: none;
      margin-top: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.72rem;
      color: var(--muted);
      word-break: break-all;
    }
    .detail-panel.open { display: block; }
    .detail-panel a { color: var(--accent); font-size: 0.72rem; }

    /* Empty */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .skip-meta { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-inner">
      <div class="header-title">
        <div>
          <h1>🔍 Skipped Items</h1>
          <div class="header-meta" id="skipMeta">Loading…</div>
        </div>
      </div>
      <a href="index.html" class="back-btn">← Dashboard</a>
    </div>
  </div>
</header>

<div class="container">

  <!-- Filter bar -->
  <div class="filter-bar" id="filterBar" style="display:none;">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <!-- Groups container -->
  <div id="groups"></div>

  <!-- Empty state -->
  <div class="empty" id="emptyState" style="display:none;">
    <p style="font-size:1.5rem;margin-bottom:8px;">✅</p>
    <p style="font-weight:700;">No skipped items this run</p>
    <p style="font-size:0.875rem;margin-top:6px;color:var(--muted);">Everything passed the filter.</p>
  </div>

</div>

<script>
(async () => {
  const $ = id => document.getElementById(id);

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  // ── Fetch data ─────────────────────────────────────────────────────────────
  let data;
  try {
    const res = await fetch('./data/prices.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    $('skipMeta').textContent = 'Could not load data: ' + e.message;
    return;
  }

  const skipped   = data.skipped   || [];
  const runStatus = data.runStatus || {};

  $('skipMeta').textContent =
    `${skipped.length} item${skipped.length !== 1 ? 's' : ''} skipped this run · Updated ${fmtDate(data.updatedAt)}`;

  if (skipped.length === 0) {
    $('emptyState').style.display = 'block';
    return;
  }

  // ── Group by reason category ───────────────────────────────────────────────
  // Reason format: "Category: detail" — group by the part before the first colon
  const reasonMap = new Map();
  skipped.forEach(item => {
    const reason = item.reason || item.skipReason || 'Unknown';
    const category = reason.split(':')[0].trim();
    if (!reasonMap.has(category)) reasonMap.set(category, []);
    reasonMap.get(category).push({ ...item, reason });
  });

  // Sort groups: largest first
  const groups = [...reasonMap.entries()].sort((a, b) => b[1].length - a[1].length);

  // ── Filter bar ─────────────────────────────────────────────────────────────
  const filterBar = $('filterBar');
  filterBar.style.display = 'flex';
  groups.forEach(([cat, items]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = cat;
    btn.textContent = `${cat} (${items.length})`;
    filterBar.appendChild(btn);
  });

  filterBar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.reason-group').forEach(g => {
      g.style.display = (f === 'all' || g.dataset.cat === f) ? 'block' : 'none';
    });
  });

  // ── Render groups ──────────────────────────────────────────────────────────
  const container = $('groups');

  groups.forEach(([category, items]) => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'reason-group';
    groupDiv.dataset.cat = category;

    groupDiv.innerHTML = `
      <div class="reason-label">
        <h2>${escHtml(category)}</h2>
        <span class="reason-count">${items.length}</span>
      </div>`;

    items.forEach((item, idx) => {
      const title    = item.title || '(no title)';
      const retailer = item.retailer || '';
      const price    = typeof item.price === 'number' ? `$${item.price.toFixed(2)}` : '';
      const url      = item.url || '';
      const reason   = item.reason || item.skipReason || 'Unknown';
      const detail   = [
        item.query    ? `Query: ${item.query}`  : null,
        item.engine   ? `Engine: ${item.engine}` : null,
        url           ? `URL: ${url}`            : null,
      ].filter(Boolean).join('\n');

      const itemDiv = document.createElement('div');
      itemDiv.className = 'skip-item';

      const detailId = `detail-${category.replace(/\W/g,'-')}-${idx}`;
      itemDiv.innerHTML = `
        <div class="skip-title">${escHtml(title)}</div>
        <div class="skip-meta">
          ${retailer ? `<span class="skip-retailer">${escHtml(retailer)}</span>` : ''}
          ${price    ? `<span class="skip-price">${price}</span>` : ''}
          <span>${escHtml(reason)}</span>
        </div>
        <button class="detail-toggle" onclick="
          var p=document.getElementById('${detailId}');
          p.classList.toggle('open');
          this.textContent=p.classList.contains('open')?'▲ Hide details':'▼ Show filter details';
        ">▼ Show filter details</button>
        <div class="detail-panel" id="${detailId}">
          <div style="white-space:pre-wrap;">${escHtml(detail)}</div>
          ${url ? `<div style="margin-top:6px;"><a href="${escHtml(url)}" target="_blank" rel="noopener">Open listing ↗</a></div>` : ''}
        </div>`;

      groupDiv.appendChild(itemDiv);
    });

    container.appendChild(groupDiv);
  });

})();
</script>
</body>
</html>
